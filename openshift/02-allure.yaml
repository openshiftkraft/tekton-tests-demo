apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: allure-results-pvc
  namespace: tekton-allure-demo
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 2Gi
  storageClassName: ocs-storagecluster-cephfs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: allure
  namespace: tekton-allure-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: allure
  template:
    metadata:
      labels:
        app: allure
    spec:
      initContainers:
        - name: prepare-report-dir
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - mkdir -p /data/allure-report
          volumeMounts:
            - name: report
              mountPath: /data
      containers:
        - name: allure-report
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: report
              mountPath: /usr/share/nginx/html
              subPath: allure-report
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: report
          persistentVolumeClaim:
            claimName: allure-results-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: allure
  namespace: tekton-allure-demo
spec:
  selector:
    app: allure
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: allure
  namespace: tekton-allure-demo
spec:
  to:
    kind: Service
    name: allure
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
