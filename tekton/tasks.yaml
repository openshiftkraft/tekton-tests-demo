apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone-light
  namespace: tekton-allure-demo
spec:
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: source
  steps:
    - name: clone
      image: alpine/git:2.45.2
      script: |
        #!/bin/sh
        set -eux
        rm -rf $(workspaces.source.path)/* $(workspaces.source.path)/.[!.]* || true
        git clone --depth 1 --branch $(params.revision) $(params.url) $(workspaces.source.path)
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: python-unit-tests
  namespace: tekton-allure-demo
spec:
  workspaces:
    - name: source
    - name: allure-results
  results:
    - name: unit-status
      description: Unit test status
  steps:
    - name: run
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euxo pipefail
        pip install --no-cache-dir -r app/requirements.txt -r requirements-test.txt
        mkdir -p reports $(workspaces.allure-results.path)
        pytest tests/unit \
          --junitxml=reports/unit-junit.xml \
          --cov=app \
          --cov-report=xml:reports/coverage.xml \
          --alluredir=$(workspaces.allure-results.path)/unit
        echo -n passed > $(results.unit-status.path)
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-image-buildah
  namespace: tekton-allure-demo
spec:
  params:
    - name: image
      type: string
  workspaces:
    - name: source
  results:
    - name: image-url
      description: Built image URL
  steps:
    - name: build-and-push
      image: quay.io/buildah/stable:v1.38
      workingDir: $(workspaces.source.path)
      securityContext:
        privileged: true
      script: |
        #!/usr/bin/env bash
        set -euxo pipefail
        buildah bud --storage-driver=vfs -t $(params.image) .
        buildah push --storage-driver=vfs --tls-verify=false $(params.image)
        echo -n "$(params.image)" > $(results.image-url.path)
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-to-openshift
  namespace: tekton-allure-demo
spec:
  params:
    - name: image
      type: string
    - name: pipeline-run-name
      type: string
  workspaces:
    - name: source
  results:
    - name: app-url
      description: OpenShift route URL for the demo API
  steps:
    - name: deploy
      image: quay.io/openshift/origin-cli:4.16
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euxo pipefail
        sed \
          -e "s|IMAGE_PLACEHOLDER|$(params.image)|g" \
          -e "s|PIPELINERUN_PLACEHOLDER|$(params.pipeline-run-name)|g" \
          openshift/03-app-template.yaml | oc apply -n $(context.taskRun.namespace) -f -
        oc rollout status deployment/demo-api -n $(context.taskRun.namespace) --timeout=180s
        HOST=$(oc get route demo-api -n $(context.taskRun.namespace) -o jsonpath='{.spec.host}')
        echo -n "http://${HOST}" > $(results.app-url.path)
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
